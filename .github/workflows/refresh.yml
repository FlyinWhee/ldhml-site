# Build the site and publish it (on every push to main, or by hand): the live site on ldhml.com (Cloudflare, live/)
# and the dev/staging copy on GitHub Pages, with the branch previews (owner, 2026-11-20).
# The league server challenges requests from data centers (GitHub, Cloudflare), so this job cannot fetch data.
# Refresh the saved snapshot from your own computer (npm run fetch:force, then commit and push data/) or from the tools
# admin (Données du site public): both push to main, so both reach ldhml.com and Pages.
# Visitors' browsers read the live data themselves.
#
# Branch previews: Pages holds ONE site, so every deploy also builds each other branch into
# /preview/<branch>/ (a "/" in the branch name becomes "-"). preview.yml starts this workflow
# when a branch is pushed or deleted. The deploy always runs from main.
name: Refresh and publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the live deploy runs only when the Cloudflare secrets exist (live/CLAUDE.md)
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs
      - name: Keep the main build for ldhml.com (the previews are for Pages only)
        run: cp -r dist dist-live
      - name: Build a preview of every other branch
        run: |
          echo "## Previews" >> "$GITHUB_STEP_SUMMARY"
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
            [ "$b" = "main" ] || [ "$b" = "HEAD" ] && continue
            safe=$(printf '%s' "$b" | tr -c 'A-Za-z0-9._-' '-')
            wt="$RUNNER_TEMP/wt-$safe"
            git worktree add -q --detach "$wt" "origin/$b"
            if (cd "$wt" && npm ci --silent && node build.mjs); then
              mkdir -p "dist/preview/$safe"
              cp -r "$wt/dist/." "dist/preview/$safe/"
              rm -rf "dist/preview/$safe/artifact"
              echo "- \`$b\`: preview/$safe/" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::The preview of branch $b did not build."
              echo "- \`$b\`: build failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy the live site (ldhml.com)
        if: env.HAS_CF == 'true'
        run: npx --yes wrangler@4.165.0 deploy -c live/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
