# Build the site and publish it to GitHub Pages (on every push to main, or by hand).
# The league server challenges requests from data centers (GitHub, Cloudflare), so this job cannot fetch data.
# Refresh the saved snapshot from your own computer: npm run fetch:force, then commit and push data/.
# Visitors' browsers read the live data themselves.
name: Refresh and publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
